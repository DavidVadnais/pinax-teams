[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinax-teams"
version = "3.0.1"
description = "An app for Django sites that supports open, by invitation, and by application teams"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
authors = [
    {name = "Pinax Team", email = "team@pinaxproject.com"},
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.0",
    "Framework :: Django :: 4.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=3.2",
    "django-reversion>=5.0.4",
    "pinax-invitations>=8.0.0",
    "python-slugify>=7.0.0",
    "Pillow>=9.3.0",
    "django-user-accounts>=3.2.0",
]

[project.optional-dependencies]
tests = [
    "django-test-plus>=1.0.22",
    "pinax-templates>=3.0.0",
]

[project.urls]
Homepage = "http://github.com/pinax/pinax-teams/"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
zip-safe = false
